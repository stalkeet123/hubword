<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HubWord - The Ultimate Social Deduction Game</title>
    <style>
        :root {
            --primary-orange: #FF6B00; /* Daha canlı, neon bir turuncu */
            --dark-bg: #0D0D0D;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body { 
            background-color: var(--dark-bg); 
            color: white; 
            text-align: center; 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
        }

        /* LOGO TASARIMI: Kutudan kurtulup neon parlamaya geçtik */
        .logo-container {
            margin-bottom: 40px;
        }

        .hub { 
            color: var(--primary-orange); 
            font-weight: 900; 
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.4); /* Neon etkisi */
        }

        .word { 
            color: #FFFFFF;
            font-weight: 300; 
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* SLOGAN */
        .tagline { 
            color: #BBB; 
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
            font-weight: 300;
        }

        /* APP STORE BUTONU */
        .btn-container {
            margin: 20px 0;
        }

        .app-store-btn {
            background-color: white;
            color: black;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            font-size: 1.1rem;
        }

        .app-store-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
        }

        /* ÖZELLİKLER (Landing Page için şart) */
        .features {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 60px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .feature-card {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: 15px;
            width: 180px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .feature-card h3 {
            font-size: 0.9rem;
            color: var(--primary-orange);
            margin-bottom: 5px;
        }

        .feature-card p {
            font-size: 0.8rem;
            color: #888;
            margin: 0;
        }

        .footer { 
            margin-top: auto; 
            padding: 40px 0;
            font-size: 0.8rem;
            opacity: 0.5;
        }

        .footer a { color: white; text-decoration: underline; }

        /* Arkaplan dekorasyonu */
        .glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            background: var(--primary-orange);
            filter: blur(150px);
            opacity: 0.15;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>

    <div class="logo-container">
        <span class="hub">Hub</span><span class="word">Word</span>
    </div>

    <p class="tagline">
        One central word. Hidden connections. <br>
        <strong>No ads. No accounts. Just the party.</strong>
    </p>

    <div class="btn-container">
        <a href="#" class="app-store-btn">Download on App Store</a>
    </div>

    <div class="features">
        <div class="feature-card">
            <h3>Instant Play</h3>
            <p>No login required. Open and start.</p>
        </div>
        <div class="feature-card">
            <h3>Social Deduction</h3>
            <p>Solve the mystery with friends.</p>
        </div>
        <div class="feature-card">
            <h3>Zero Ads</h3>
            <p>Uninterrupted gaming experience.</p>
        </div>
    </div>
    
    <div class="footer">
        © 2026 HubWord Game. <a href="privacy.html">Privacy Policy</a>
    </div>
</body>
</html>
